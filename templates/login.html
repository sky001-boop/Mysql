{% extends "base.html" %}

{% block content %}
<div class="container" style="justify-content: center; align-items: center; min-height: 60vh;">
    <div style="background: white; border-radius: 8px; padding: 40px; width: 400px; box-shadow: 0 2px 12px rgba(0,0,0,0.1);">
        <h2 style="text-align: center; margin-bottom: 30px; color: var(--primary);">用户登录</h2>
        <form method="POST" style="display: flex; flex-direction: column; gap: 20px;">
            <div>
                <label style="display: block; margin-bottom: 8px; font-size: 14px;">用户名</label>
                <input type="text" name="user_name" required style="width: 100%; padding: 12px; border: 1px solid #eee; border-radius: 4px;">
            </div>
            <div>
                <label style="display: block; margin-bottom: 8px; font-size: 14px;">密码</label>
                <input type="password" name="password" required style="width: 100%; padding: 12px; border: 1px solid #eee; border-radius: 4px;">
            </div>
            <button type="submit" class="btn btn-primary" style="padding: 12px; font-size: 16px;">登录</button>
        </form>
    </div>
</div>
{% endblock %}
